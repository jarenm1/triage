[project]
name = "triage-rl"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy==2.2.6",
  "torch==2.7.1+cu128",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
