[workspace]
members = [
  "crates/sim-graphics",
  "crates/sim-graphics-winit",
  "crates/sim-inspection",
  "crates/sim-scene",
  "crates/sim-trajectory",
  "apps/render-smoke",
  "apps/rgb-benchmark",
  "apps/rgb-env",
  "apps/window-demo",
  "apps/web-demo",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.87"

[workspace.dependencies]
anyhow = "1.0"
bytemuck = { version = "1.24", features = ["derive"] }
glam = { version = "0.30", features = ["bytemuck"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "hdr", "webp", "exr"] }
pollster = "0.4"
profiling = "1.0.18"
wgpu = { version = "30.0.1", features = ["webgl"] }
winit = "0.30.12"
web-time = "1.1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
console_log = "1.0"
log = "0.4"
web-sys = { version = "0.3", features = [
  "Document",
  "Element",
  "HtmlCanvasElement",
  "Node",
  "Window",
  "CssStyleDeclaration",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.dev.package."*"]
opt-level = 2
