[package]
name = "render-smoke"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
glam.workspace = true
image.workspace = true
pollster.workspace = true
wgpu.workspace = true
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3"
sim-scene = { path = "../../crates/sim-scene" }
sim-graphics = { path = "../../crates/sim-graphics" }
sim-inspection = { path = "../../crates/sim-inspection" }
sim-trajectory = { path = "../../crates/sim-trajectory" }

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
rustix = { version = "1", features = ["fs"] }
