<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autonomous Drone Swarm Simulator</title>
    <link data-trunk rel="rust" href="Cargo.toml" />
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b0d13;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
            color: #e0e8f0;
        }
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(11, 15, 23, 0.85);
            padding: 12px 18px;
            border-radius: 8px;
            border: 1px solid rgba(56, 189, 248, 0.3);
            pointer-events: none;
            backdrop-filter: blur(8px);
            z-index: 10;
        }
        #hud h1 {
            margin: 0 0 6px 0;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #38bdf8;
        }
        #hud p {
            margin: 0;
            font-size: 12px;
            color: #94a3b8;
            line-height: 1.4;
        }
        canvas {
            width: 100%;
            height: 100%;
            max-width: 1280px;
            max-height: 720px;
            aspect-ratio: 16 / 9;
            display: block;
            outline: none;
            border-radius: 8px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(56, 189, 248, 0.15);
        }
    </style>
</head>
<body>
    <div id="hud">
        <h1>Autonomous Drone Swarm</h1>
        <p>100 Drones • 3D Boid Flocking • Obstacle Avoidance • Dynamic Crash & Respawn</p>
    </div>
    <canvas id="sim-canvas"></canvas>
</body>
</html>
